[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram_data_agent"
version = "0.1.0"
description = "SQL agent using agents to query telegram data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pyspark",
    
]

[tool.setuptools]
packages = ["src"]